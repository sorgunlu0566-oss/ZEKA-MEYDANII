<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#10172d">
<link rel="manifest" href="manifest.json">
<title>ZEKÂ MEYDANI</title>
<style>
:root{--bg:#0b1020;--panel:#182343;--line:#5572b8;--text:#fff;--muted:#aeb8d2;--accent:#76a7ff;--gold:#ffd86b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);touch-action:none}
body{overflow:hidden}
#app{min-height:100vh;display:flex;justify-content:center}
.game{width:min(100%,760px);min-height:100vh;padding:14px 14px 22px;position:relative;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 8px;font-weight:800}
.brand{font-size:25px;letter-spacing:.3px}.stats{display:flex;gap:18px;font-size:18px}
.card{background:linear-gradient(180deg,#1b2749,#17213d);border:2px solid #3c548c;border-radius:30px;padding:18px 16px 22px;box-shadow:0 16px 50px #0007}
.meta{text-align:center;color:#c1c9db;font-size:19px;margin-bottom:8px}
h1{text-align:center;font-size:39px;margin:8px 0 3px}.sub{text-align:center;color:#c0c8da;font-size:18px;margin-bottom:15px}
.scene{height:205px;border-radius:22px;overflow:hidden;position:relative;border:2px solid #405a98;background:#1d3762}
.scene .sky{position:absolute;inset:0;background:linear-gradient(#4b82d4 0 52%,#83b6e8 52% 55%,#6ca85c 55%);}.scene .sun{position:absolute;width:65px;height:65px;border-radius:50%;background:#ffe6a1;right:12%;top:16%;box-shadow:0 0 35px #ffe6a1aa}
.scene .mount{position:absolute;bottom:30%;width:0;height:0;border-left:120px solid transparent;border-right:120px solid transparent;border-bottom:120px solid #436d67;left:8%}
.scene .mount2{left:42%;border-left-width:150px;border-right-width:150px;border-bottom-width:145px;border-bottom-color:#335a5b}
.scene .ground{position:absolute;bottom:0;left:0;right:0;height:31%;background:#42784a}
.scene .water{position:absolute;bottom:0;right:0;width:55%;height:20%;background:#2b82ae;border-radius:50% 0 0 0;opacity:.85}
.scene .caption{position:absolute;left:16px;bottom:12px;background:#091126bb;border-radius:14px;padding:7px 11px;font-weight:800;font-size:14px}
.boards{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin:16px auto 18px;max-width:610px;min-height:58px}
.word{display:flex;gap:5px;margin:0 8px 8px}
.slot{width:42px;height:48px;border-radius:10px;border:2px solid #6b82bb;background:#0a1022;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:25px}
.slot.filled{background:#344c82;border-color:#89a8ff}
.hint{height:24px;text-align:center;color:#aeb8d2;font-weight:700;margin-bottom:8px}
.letters{position:relative;width:300px;height:220px;margin:0 auto 6px}
.letter{position:absolute;width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#5571b3,#2e447a);border:3px solid #91a9e7;box-shadow:0 8px 18px #0006;font-size:29px;font-weight:900;z-index:3;user-select:none}
.letter.selected{background:radial-gradient(circle at 35% 30%,#8ab7ff,#4666a9);transform:scale(1.06);box-shadow:0 0 0 5px #78a5ff33,0 10px 25px #0008}
#lines{position:absolute;inset:0;z-index:2;overflow:visible}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
button{border:0;border-radius:18px;padding:16px 10px;background:#304474;color:#fff;font-size:17px;font-weight:900}
button:active{transform:scale(.98)}.clear{grid-column:1/-1}
.message{text-align:center;height:36px;font-weight:900;font-size:18px;padding-top:4px}
.progress{height:12px;background:#080d1b;border-radius:99px;overflow:hidden;margin:5px 0 12px}.bar{height:100%;width:0;background:#8aa8ff;border-radius:99px;transition:.25s}
.footer{text-align:center;color:#8f9ab5;font-size:13px;margin-top:12px}
@media(max-height:720px){.scene{height:150px}.letters{height:190px}.letter{width:65px;height:65px}.slot{width:35px;height:42px}.card{padding-top:12px}}
</style>
</head>
<body>
<div id="app"><main class="game">
<div class="top"><div class="brand">🧠 ZEKÂ MEYDANI</div><div class="stats">💎 <span id="gems">50</span> &nbsp; 🏆 <span id="score">0</span></div></div>
<section class="card">
<div class="meta">BÖLÜM <span id="levelNo">1</span> • XP <span id="xp">0</span>/100</div>
<h1>Kelime Meydanı</h1><div class="sub">Harfleri birleştir, kelimeleri keşfet</div>
<div class="scene" id="scene"><div class="sky"></div><div class="sun"></div><div class="mount"></div><div class="mount2 mount"></div><div class="ground"></div><div class="water"></div><div class="caption" id="sceneCaption">DOĞA • KEŞİF</div></div>
<div class="boards" id="boards"></div>
<div class="hint" id="hint">Bir harfe basılı tut ve sürükle.</div>
<div class="letters" id="letters"><svg id="lines"></svg></div>
<div class="message" id="message"></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="controls"><button id="shuffle">🔀 KARIŞTIR</button><button id="reveal">💎 HARF AÇ • 20</button><button class="clear" id="clear">↩ TEMİZLE</button></div>
<div class="footer">V8.5 • Çevrimdışı oyun çekirdeği • Harici kütüphane yok</div>
</section>
</main></div>
<script>
const LEVELS=[
{cat:"DOĞA",title:"KEŞİF",words:["GÖL","GÜL"],main:["GÖL","GÜL"],letters:["G","Ö","Ü","L"],theme:"nature"},
{cat:"TARİH",title:"ANADOLU",words:["TAŞ","TARİH","HAN","TAHT"],main:["TARİH","HAN"],letters:["T","A","R","İ","H","N"],theme:"history"},
{cat:"SANAT",title:"RENKLER",words:["RENK","KAR","NAR","SANAT"],main:["RENK","SANAT"],letters:["S","A","N","R","E","K"],theme:"art"},
{cat:"UZAY",title:"YILDIZLAR",words:["AY","YILDIZ","YIL","UZAY"],main:["AY","YIL"],letters:["A","Y","I","L"],theme:"space"},
{cat:"DENİZ",title:"MAVİ DÜNYA",words:["DENİZ","DİZ","İZ","AD"],main:["DENİZ","İZ"],letters:["D","E","N","İ","Z"],theme:"sea"},
{cat:"BİLİM",title:"KEŞFET",words:["ATOM","MAT","MOT","ATOM"],main:["ATOM","MAT"],letters:["A","T","O","M"],theme:"science"}
];
let level=0,gems=50,score=0,xp=0,found=new Set(),selected=[],dragging=false;
const $=id=>document.getElementById(id);
function norm(s){return s.toLocaleUpperCase("tr-TR")}
function render(){
 const L=LEVELS[level]; found=new Set(); selected=[]; dragging=false;
 $("levelNo").textContent=level+1;$("gems").textContent=gems;$("score").textContent=score;$("xp").textContent=xp;
 $("sceneCaption").textContent=L.cat+" • "+L.title; $("hint").textContent="Bir harfe basılı tut ve sürükle.";
 const boards=$("boards"); boards.innerHTML="";
 L.main.forEach(w=>{let row=document.createElement("div");row.className="word";[...w].forEach(()=>{let s=document.createElement("div");s.className="slot";row.appendChild(s)});boards.appendChild(row)});
 const cont=$("letters"); cont.querySelectorAll(".letter").forEach(e=>e.remove());
 const positions=[[113,8],[204,58],[204,148],[113,148],[22,148],[22,58],[113,98]];
 L.letters.forEach((ch,i)=>{let b=document.createElement("div");b.className="letter";b.textContent=ch;b.dataset.i=i;b.dataset.ch=ch;b.style.left=positions[i%positions.length][0]+"px";b.style.top=positions[i%positions.length][1]+"px";b.addEventListener("pointerdown",start);b.addEventListener("pointerenter",enter);cont.appendChild(b)});
 $("message").textContent=""; $("bar").style.width=((found.size/L.main.length)*100)+"%";drawLines();
}
function pointFor(el){return {x:el.offsetLeft+el.offsetWidth/2,y:el.offsetTop+el.offsetHeight/2}}
function start(e){e.preventDefault();dragging=true;selected=[e.currentTarget];e.currentTarget.classList.add("selected");e.currentTarget.setPointerCapture?.(e.pointerId);drawLines()}
function enter(e){if(!dragging)return;let el=e.currentTarget;if(selected.includes(el))return;selected.push(el);el.classList.add("selected");drawLines()}
document.addEventListener("pointerup",()=>{if(!dragging)return;dragging=false;const word=selected.map(x=>x.dataset.ch).join("");check(word);selected.forEach(x=>x.classList.remove("selected"));selected=[];drawLines()},{passive:true});
function drawLines(){const svg=$("lines");svg.innerHTML="";if(selected.length<2)return;let ns="http://www.w3.org/2000/svg";let p=selected.map(pointFor);let poly=document.createElementNS(ns,"polyline");poly.setAttribute("points",p.map(q=>q.x+","+q.y).join(" "));poly.setAttribute("fill","none");poly.setAttribute("stroke","#8eb3ff");poly.setAttribute("stroke-width","9");poly.setAttribute("stroke-linecap","round");poly.setAttribute("stroke-linejoin","round");svg.appendChild(poly)}
function check(word){
 const L=LEVELS[level];
 if(!L.words.map(norm).includes(norm(word))){$("message").textContent="❌ Bu kelime bu bölümde yok.";return}
 if(found.has(norm(word))){$("message").textContent="↩ Bu kelime zaten bulundu.";return}
 found.add(norm(word));score+=100;xp+=25;$("score").textContent=score;$("xp").textContent=xp;
 $("message").textContent="✅ "+word+" bulundu! +100 puan";
 fillBoards(word);
 $("bar").style.width=Math.min(100,found.size/L.main.length*100)+"%";
 if(L.main.every(w=>found.has(norm(w))))setTimeout(next,700);
}
function fillBoards(word){
 document.querySelectorAll(".word").forEach(row=>{let len=row.children.length;if(len===word.length){[...word].forEach((c,i)=>{row.children[i].textContent=c;row.children[i].classList.add("filled")})}});
}
function next(){if(level<LEVELS.length-1){level++;xp=xp%100;render()}else{$("message").textContent="🏆 İlk dünya tamamlandı!";}}
$("clear").onclick=()=>{selected.forEach(x=>x.classList.remove("selected"));selected=[];dragging=false;drawLines();$("message").textContent=""};
$("shuffle").onclick=()=>{let L=LEVELS[level];L.letters.sort(()=>Math.random()-.5);render();$("message").textContent="🔀 Harfler karıştırıldı."};
$("reveal").onclick=()=>{if(gems<20){$("message").textContent="💎 Yeterli elmas yok.";return}let L=LEVELS[level];let target=L.main.find(w=>!found.has(norm(w)));if(!target)return;gems-=20;found.add(norm(target));score+=100;xp+=25;$("gems").textContent=gems;$("score").textContent=score;$("xp").textContent=xp;fillBoards(target);$("message").textContent="💎 "+target+" açıldı!";$("bar").style.width=Math.min(100,found.size/L.main.length*100)+"%";if(L.main.every(w=>found.has(norm(w))))setTimeout(next,700)};
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js?v=85"));
render();
</script>
</body></html>
