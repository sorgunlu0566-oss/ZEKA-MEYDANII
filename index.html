<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.json">
<title>ZEKÂ MEYDANI — Kelime Meydanı</title>
<style>
:root{--bg:#080d1b;--panel:#172342;--line:#6f8fdc;--text:#fff;--muted:#aeb9d5;--accent:#8fb0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{display:flex;justify-content:center}
.app{width:min(100%,760px);min-height:100vh;padding:18px 14px 30px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 8px 18px}
.brand{font-size:27px;font-weight:900;letter-spacing:.5px}.stats{display:flex;gap:20px;font-weight:800;font-size:20px}
.panel{background:linear-gradient(180deg,#1b2a4d,#172342);border:2px solid #3f5b98;border-radius:34px;padding:20px 18px 26px;box-shadow:0 20px 60px #0006}
.meta{text-align:center;color:#c1c9dc;font-size:18px;margin:0 0 12px}.title{text-align:center;font-size:42px;line-height:1.05;margin:0 0 6px;font-weight:900}.sub{text-align:center;color:#c3cbe0;font-size:18px;margin-bottom:16px}
.scene{height:190px;border-radius:28px;overflow:hidden;position:relative;border:2px solid #5672b6;background:#304b75}
.scene svg{width:100%;height:100%;display:block}.tag{position:absolute;left:18px;bottom:16px;background:#10221fdd;padding:10px 18px;border-radius:18px;font-weight:900;font-size:16px}
.wordboard{display:flex;flex-direction:column;gap:10px;margin:18px auto 24px;max-width:620px}
.wordrow{display:flex;justify-content:center;gap:7px;min-height:46px}.slot{width:44px;height:48px;border:3px solid #728fd6;border-radius:12px;background:#071021;display:grid;place-items:center;font-size:25px;font-weight:900}.slot.filled{background:#2c4277;border-color:#a8c0ff}
.hint{text-align:center;color:#b9c3dc;font-weight:700;margin:4px 0 16px}
.letters{height:300px;position:relative;touch-action:none;user-select:none;-webkit-user-select:none;max-width:560px;margin:auto}
.letter{position:absolute;width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#6f8fe0,#3d5794);border:5px solid #91adf6;box-shadow:0 12px 25px #0008;font-size:31px;font-weight:900;transform:translate(-50%,-50%);z-index:4;touch-action:none}
.letter.active{background:radial-gradient(circle at 35% 28%,#9ab6ff,#536eaf);transform:translate(-50%,-50%) scale(1.1);box-shadow:0 0 0 8px #8fb0ff33,0 14px 30px #0009}
#links{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible}.link{stroke:#9fc0ff;stroke-width:9;stroke-linecap:round;filter:drop-shadow(0 0 7px #8fb0ff)}
#trail{position:absolute;inset:0;z-index:3;pointer-events:none}
.message{text-align:center;min-height:28px;font-size:17px;font-weight:800;margin:0 0 12px}
.good{color:#7dff9d}.bad{color:#ff7777}.info{color:#c6d1eb}
.progress{height:10px;background:#050a15;border-radius:20px;overflow:hidden;margin:10px 0 16px}.progress>i{display:block;height:100%;background:#8ba8ef;width:0%;transition:.3s}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:22px;padding:16px 12px;background:#304576;color:white;font-weight:900;font-size:16px}.btn:active{transform:scale(.98)}.btn.wide{grid-column:1/-1}
.small{text-align:center;color:#8792ad;font-size:13px;margin-top:16px}
@media(max-width:430px){.title{font-size:34px}.scene{height:170px}.slot{width:39px;height:44px}.letter{width:74px;height:74px;font-size:28px}.letters{height:285px}.top{align-items:flex-start}.stats{font-size:17px;gap:12px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">🧠 ZEKÂ MEYDANI</div><div class="stats">💎 <span id="gems">50</span> 🏆 <span id="score">0</span></div></div>
  <main class="panel">
    <div class="meta">BÖLÜM <span id="level">1</span> • XP <span id="xp">0</span>/100</div>
    <h1 class="title">Kelime Meydanı</h1>
    <div class="sub">Harfleri birleştir, kelimeleri keşfet</div>
    <div class="scene" id="scene"><div class="tag" id="tag">DOĞA • KEŞİF</div></div>
    <div class="wordboard" id="board"></div>
    <div class="hint">Bir harfe basılı tut ve sürükle.</div>
    <div class="letters" id="letters"><svg id="links"></svg><svg id="trail"></svg></div>
    <div class="message info" id="msg">İlk harfe dokunup parmağını kaldırmadan sürükle.</div>
    <div class="progress"><i id="bar"></i></div>
    <div class="controls"><button class="btn" id="shuffle">🔀 KARIŞTIR</button><button class="btn" id="hintBtn">💎 HARF AÇ • 20</button><button class="btn wide" id="clear">↩ TEMİZLE</button></div>
    <div class="small">V8.3 • Gerçek sürükle-bırak Word Connect • PWA • Harici kütüphane yok</div>
  </main>
</div>
<script>
const LEVELS=[
 {theme:"DOĞA • KEŞİF",kind:"nature",words:["GÖL","GÖLÜ"],letters:["G","Ö","L","Ü"]},
 {theme:"TARİH • MEDENİYET",kind:"history",words:["KALE","EL"],letters:["K","A","L","E"]},
 {theme:"SANAT • ESTETİK",kind:"art",words:["RENK","KAR"],letters:["R","E","N","K","A"]},
 {theme:"BİLİM • MERAK",kind:"science",words:["ATOM","MAT"],letters:["A","T","O","M"]},
 {theme:"DENİZ • KEŞİF",kind:"sea",words:["DALGA","DAL"],letters:["D","A","L","G"]},
 {theme:"UZAY • EVREN",kind:"space",words:["AY","YILDIZ"],letters:["A","Y","I","L","D","Z"]},
 {theme:"MÜZİK • RİTİM",kind:"music",words:["NOTA","TON"],letters:["N","O","T","A"]},
 {theme:"HAYVANLAR • YAŞAM",kind:"animals",words:["KURT","KUŞ"],letters:["K","U","R","T","Ş"]},
 {theme:"DİN • KÜLTÜR",kind:"culture",words:["DUA","CAMİ"],letters:["D","U","A","C","M","İ"]},
 {theme:"COĞRAFYA • DÜNYA",kind:"geo",words:["DAĞ","GÖL"],letters:["D","A","Ğ","G","Ö","L"]}
];
function levelData(n){ return LEVELS[(n-1)%LEVELS.length]; }

const $=s=>document.querySelector(s);
let level=Number(localStorage.getItem("zm_level")||1),xp=Number(localStorage.getItem("zm_xp")||0),gems=Number(localStorage.getItem("zm_gems")||50),score=Number(localStorage.getItem("zm_score")||0);
let data,selected=[],found=new Set(),positions=[],dragging=false,lastPos=null;

function sceneSvg(kind){
 const bg={nature:["#5b86d8","#4d7068"],history:["#d1a16a","#6b4b31"],art:["#9b6fc4","#e56b8a"],science:["#19294c","#2d6b8c"],sea:["#4b91d0","#155a8a"],space:["#090d27","#4a3c86"],music:["#6e4e99","#d56c82"],animals:["#7db36a","#466b4e"],culture:["#d7b36a","#8a6044"],geo:["#77a9dc","#668d59"]}[kind]||["#5b86d8","#4d7068"];
 return `<svg viewBox="0 0 800 260" preserveAspectRatio="xMidYMid slice"><rect width="800" height="260" fill="${bg[0]}"/><circle cx="680" cy="52" r="36" fill="#ffeaa0" opacity=".9"/><path d="M0 185 L145 65 260 175 390 40 520 175 650 80 800 175 V260 H0Z" fill="${bg[1]}"/><path d="M0 215 Q180 175 360 220 T800 205 V260 H0Z" fill="#214d42" opacity=".75"/><circle cx="120" cy="60" r="8" fill="#fff" opacity=".45"/><circle cx="160" cy="90" r="5" fill="#fff" opacity=".4"/><path d="M0 230 Q180 205 360 235 T800 225" stroke="#7bc6e8" stroke-width="22" fill="none" opacity=".55"/></svg>`;
}
function render(){
 data=levelData(level); $("#level").textContent=level; $("#xp").textContent=xp; $("#gems").textContent=gems; $("#score").textContent=score; $("#tag").textContent=data.theme; $("#scene").insertAdjacentHTML("afterbegin",sceneSvg(data.kind));
 const board=$("#board"); board.innerHTML="";
 data.words.forEach(w=>{const row=document.createElement("div");row.className="wordrow";for(let i=0;i<w.length;i++){let s=document.createElement("div");s.className="slot";s.dataset.word=w;s.dataset.i=i;row.appendChild(s)}board.appendChild(row)});
 buildLetters(); msg("İlk harfe dokunup parmağını kaldırmadan sürükle.","info");
}
function buildLetters(){
 const box=$("#letters"); [...box.querySelectorAll(".letter")].forEach(x=>x.remove()); $("#links").innerHTML=""; $("#trail").innerHTML="";
 const w=box.clientWidth,h=box.clientHeight,cx=w/2,cy=h/2,r=Math.min(w,h)*.33;
 positions=[];
 data.letters.forEach((ch,i)=>{let a=-Math.PI/2+(i/data.letters.length)*Math.PI*2;positions.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r});});
 data.letters.forEach((ch,i)=>{let el=document.createElement("div");el.className="letter";el.textContent=ch;el.dataset.i=i;el.style.left=positions[i].x+"px";el.style.top=positions[i].y+"px";box.appendChild(el)});
}
function point(e){let r=$("#letters").getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function hit(p){for(let i=0;i<positions.length;i++){let q=positions[i];if(Math.hypot(p.x-q.x,p.y-q.y)<46)return i}return -1}
function draw(){
 $("#links").innerHTML=selected.map((i,k)=>k?`<line class="link" x1="${positions[selected[k-1]].x}" y1="${positions[selected[k-1]].y}" x2="${positions[i].x}" y2="${positions[i].y}"/>`:"").join("");
 [...document.querySelectorAll(".letter")].forEach((e,i)=>e.classList.toggle("active",selected.includes(i)));
}
function msg(t,c){$("#msg").textContent=t;$("#msg").className="message "+c}
function clearSel(){selected=[];lastPos=null;draw()}
function submit(){
 if(!selected.length)return;
 const word=selected.map(i=>data.letters[i]).join("");
 const target=data.words.find(w=>w===word);
 if(!target){msg("❌ Bu kelime bu bölümde yok.","bad");clearSel();return}
 if(found.has(target)){msg("↩ Bu kelime zaten bulundu.","info");clearSel();return}
 found.add(target); [...document.querySelectorAll(".slot")].filter(s=>s.dataset.word===target).forEach((s,i)=>{s.textContent=target[i];s.classList.add("filled")});
 xp=Math.min(100,xp+25);score+=100;gems+=5;save();$("#xp").textContent=xp;$("#score").textContent=score;$("#gems").textContent=gems;$("#bar").style.width=xp+"%";
 msg("✅ "+target+" bulundu! +100 puan","good");clearSel();
 if(found.size===data.words.length){setTimeout(()=>{level++;xp=0;found=new Set();save();render()},700)}
}
$("#letters").addEventListener("pointerdown",e=>{let p=point(e),i=hit(p);if(i<0)return;e.preventDefault();dragging=true;selected=[i];lastPos=p;$("#letters").setPointerCapture(e.pointerId);draw()});
$("#letters").addEventListener("pointermove",e=>{if(!dragging)return;let p=point(e),i=hit(p);lastPos=p;if(i>=0&&!selected.includes(i)){selected.push(i);draw()}$("#trail").innerHTML=lastPos&&selected.length?`<line class="link" x1="${positions[selected[selected.length-1]].x}" y1="${positions[selected[selected.length-1]].y}" x2="${p.x}" y2="${p.y}"/>`:""});
$("#letters").addEventListener("pointerup",e=>{if(!dragging)return;dragging=false;$("#trail").innerHTML="";submit()});
$("#letters").addEventListener("pointercancel",()=>{dragging=false;$("#trail").innerHTML="";clearSel()});
$("#clear").onclick=()=>{clearSel();msg("Seçim temizlendi.","info")};
$("#shuffle").onclick=()=>{data.letters.sort(()=>Math.random()-.5);buildLetters();msg("🔀 Harfler karıştırıldı.","info")};
$("#hintBtn").onclick=()=>{if(gems<20){msg("💎 Yeterli elmas yok.","bad");return}let target=data.words.find(w=>!found.has(w));if(!target)return;gems-=20;save();$("#gems").textContent=gems;let idx=target.length-1;document.querySelectorAll(".slot").forEach(s=>{if(s.dataset.word===target&&Number(s.dataset.i)===idx){s.textContent=target[idx];s.classList.add("filled")}});msg("💎 Bir harf açıldı.","info")};
function save(){localStorage.setItem("zm_level",level);localStorage.setItem("zm_xp",xp);localStorage.setItem("zm_gems",gems);localStorage.setItem("zm_score",score)}
window.addEventListener("resize",()=>{if(data)buildLetters()});render();
</script>
</body>
</html>
