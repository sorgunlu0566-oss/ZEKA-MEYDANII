<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZEKÂ MEYDANI">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>ZEKÂ MEYDANI V8.2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#080d1b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
body{padding:10px}
.app{max-width:520px;margin:auto;min-height:calc(100vh - 20px);padding:14px 12px 24px;background:linear-gradient(180deg,#19233f,#0b1020);border:1px solid #33476f;border-radius:28px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:900}.brand{font-size:21px}.stats{white-space:nowrap;font-size:17px}
.card{margin-top:14px;background:#1b2643;border:1px solid #3b4d79;border-radius:25px;padding:17px 13px 20px;text-align:center}.sub{opacity:.72;font-size:18px}.title{font-size:34px;font-weight:900;margin:6px 0}.hint{opacity:.72;font-size:18px}
.slots{height:72px;margin:17px 2px 14px;display:flex;justify-content:center;align-items:center;gap:7px;min-width:0}.slot{width:43px;height:56px;border-radius:11px;border:2px solid #4b6191;background:#070c19;display:grid;place-items:center;font-size:29px;font-weight:900;color:#fff;box-shadow:inset 0 0 0 1px #182541}.slot.empty{color:transparent}.slot.filled{background:#273a66;border-color:#8aa7e9;box-shadow:0 0 14px #6b86c444}
.letter-area{position:relative;width:100%;height:300px;margin:3px auto 0;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.drag-svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}.drag-line{fill:none;stroke:#9bb9ff;stroke-width:11;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 7px #6b86c4)}
.key{position:absolute;z-index:2;width:82px;height:82px;border:2px solid #536da9;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a6299,#304777);color:#fff;font-size:31px;font-weight:900;display:grid;place-items:center;box-shadow:0 7px 18px #0005;touch-action:none;cursor:pointer;transition:transform .08s,background .08s,border-color .08s}.key.sel{background:radial-gradient(circle at 35% 30%,#7897e1,#4b67a2);border-color:#b8ceff;box-shadow:0 0 0 4px #8fb2ff44,0 0 25px #6b86c488;transform:scale(1.06)}.key.used{opacity:.32}
.msg{min-height:36px;margin:5px 0 8px;font-weight:800;font-size:18px}.found{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:29px}.tag{padding:6px 9px;border-radius:9px;background:#26375f;border:1px solid #415b8a;font-weight:800}.progress{height:8px;background:#080d1b;border-radius:9px;overflow:hidden;margin-top:12px}.fill{height:100%;width:0;background:#6b86c4}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.act{height:55px;border:0;border-radius:15px;background:#2a3b67;color:#fff;font-weight:900;font-size:14px;touch-action:manipulation}.next{grid-column:1/-1;background:#4565a5}.wide{grid-column:1/-1}.note{font-size:12px;opacity:.48;margin-top:13px}
@media(max-width:390px){.key{width:72px;height:72px;font-size:28px}.letter-area{height:270px}.slots{gap:5px}.slot{width:38px;height:52px;font-size:26px}.title{font-size:30px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand">🧠 ZEKÂ MEYDANI</div><div class="stats">💎 <span id="gems">50</span>　🏆 <span id="score">0</span></div></header>
<section class="card">
<div class="sub">BÖLÜM <span id="level">1</span> • XP <span id="xp">0</span>/100</div>
<div class="title">Kelimeleri Bul</div>
<div class="hint">Harfleri dairelerin üzerinden sürükle</div>
<div class="slots" id="slots" aria-label="Kelime kutucukları"></div>
<div class="letter-area" id="letterArea"></div>
<div class="msg" id="msg">Bir harfe basılı tut ve sürükle.</div>
<div class="found" id="found"></div>
<div class="progress"><div class="fill" id="fill"></div></div>
<div class="actions"><button class="act" id="shuffle">🔀 KARIŞTIR</button><button class="act" id="hint">💎 HARF AÇ · 20</button><button class="act wide" id="clear">↩️ TEMİZLE</button><button class="act next" id="next" style="display:none">🏆 SONRAKİ BÖLÜM</button></div>
<div class="note">V8.2 PWA • Word Connect • İnternetsiz oynanabilir</div>
</section></main>
<script>
(()=>{"use strict";
const LEVELS=[
{letters:["K","A","L","E","M","İ"],words:["KALEM","ALEM","KEL","KİM","İLK"]},
{letters:["B","A","L","I","K","Ç"],words:["BALIK","BALI","BAK","BAL","ÇAL","KIL"]},
{letters:["K","A","R","P","U","Z"],words:["KARPUZ","KAR","KAP","KUR","KAZ","PAR"]},
{letters:["Ç","İ","Ç","E","K"],words:["ÇİÇEK","ÇEK","İÇ","KEÇİ"]},
{letters:["A","R","A","B","A"],words:["ARABA","ARA","BAR","ABA"]},
{letters:["D","E","N","İ","Z"],words:["DENİZ","DİN","İZ","DİNE"]},
{letters:["K","İ","T","A","P"],words:["KİTAP","KAT","KAP","KİT","AT"]},
{letters:["O","Y","U","N"],words:["OYUN","OY","UY","ON"]},
{letters:["G","Ü","N","E","Ş"],words:["GÜNEŞ","GÜN","NEŞE","ŞEN"]},
{letters:["B","U","L","U","T"],words:["BULUT","BUL","BUT","ULU"]}
];
let levelIndex=0,current="",found=[],gems=50,score=0,xp=0,completed=false;
const $=id=>document.getElementById(id); const lv=()=>LEVELS[levelIndex];
function save(){try{localStorage.setItem("zeka_meydani_v82",JSON.stringify({levelIndex,gems,score,xp}));}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem("zeka_meydani_v82")||"null");if(s){levelIndex=Math.max(0,Math.min(LEVELS.length-1,s.levelIndex|0));gems=Math.max(0,s.gems|0);score=Math.max(0,s.score|0);xp=Math.max(0,s.xp|0)}}catch(e){}}
function message(t){$("msg").textContent=t}
function counts(arr){const m=new Map();arr.forEach(x=>m.set(x,(m.get(x)||0)+1));return m}
function canBuild(candidate){const have=counts(lv().letters),used=counts([...candidate]);for(const [ch,n] of used)if((have.get(ch)||0)<n)return false;return true}
function renderSlots(){const box=$("slots");box.innerHTML="";const max=Math.min(lv().words.reduce((m,w)=>Math.max(m,w.length),0),7);const n=Math.max(4,Math.min(7,max));for(let i=0;i<n;i++){const s=document.createElement("div");s.className="slot"+(i<current.length?" filled":" empty");s.textContent=current[i]||"";box.appendChild(s)}}
function posFor(i,n){const W=$("letterArea").clientWidth,H=$("letterArea").clientHeight;const cx=W/2,cy=H/2+3;const radius=Math.min(W,H)*.31;const angle=-Math.PI/2+(i/n)*Math.PI*2;return{x:cx+Math.cos(angle)*radius,y:cy+Math.sin(angle)*radius}}
function renderLetters(){const area=$("letterArea");area.innerHTML="";const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.classList.add("drag-svg");const poly=document.createElementNS("http://www.w3.org/2000/svg","polyline");poly.classList.add("drag-line");svg.appendChild(poly);area.appendChild(svg);
const n=lv().letters.length;lv().letters.forEach((ch,i)=>{const b=document.createElement("button");b.type="button";b.className="key";b.textContent=ch;b.dataset.ch=ch;b.dataset.i=i;const p=posFor(i,n);b.style.left=(p.x-41)+"px";b.style.top=(p.y-41)+"px";area.appendChild(b)});updateVisual()}
function render(){$("level").textContent=levelIndex+1;$("gems").textContent=gems;$("score").textContent=score;$("xp").textContent=xp;$("fill").style.width=Math.min(100,xp)+"%";renderSlots();$("found").innerHTML=found.map(w=>`<span class="tag">✓ ${w}</span>`).join("");$("next").style.display=completed?"block":"none";$("clear").style.display=completed?"none":"block";renderLetters()}
let dragging=false,selected=[],pointerId=null;
function buttonAt(x,y){const e=document.elementFromPoint(x,y);return e&&e.closest?e.closest("button.key"):null}
function center(b){const r=b.getBoundingClientRect(),a=$("letterArea").getBoundingClientRect();return{x:r.left+r.width/2-a.left,y:r.top+r.height/2-a.top}}
function updateVisual(){const poly=$("letterArea").querySelector(".drag-line");if(poly)poly.setAttribute("points",selected.map(center).map(p=>p.x+","+p.y).join(" "))}
function clearSel(){selected.forEach(b=>b.classList.remove("sel"));selected=[];updateVisual()}
function add(b){if(!b||completed||selected.includes(b))return;const candidate=current+b.dataset.ch;if(!canBuild(candidate))return;if(!lv().words.some(w=>w.startsWith(candidate))){message("❌ Bu harfle devam eden kelime yok.");return}selected.push(b);b.classList.add("sel");current=candidate;renderSlots();updateVisual();if(navigator.vibrate)try{navigator.vibrate(8)}catch(_){} }
function start(e){if(completed)return;const b=e.target.closest("button.key");if(!b)return;e.preventDefault();dragging=true;pointerId=e.pointerId;clearSel();current="";try{$("letterArea").setPointerCapture(e.pointerId)}catch(_){}add(b)}
function move(e){if(!dragging||e.pointerId!==pointerId)return;e.preventDefault();add(buttonAt(e.clientX,e.clientY))}
function end(e){if(!dragging||e.pointerId!==pointerId)return;e.preventDefault();dragging=false;try{$("letterArea").releasePointerCapture(e.pointerId)}catch(_){}pointerId=null;submit()}
function submit(){if(!current){clearSel();render();return}const w=current;if(lv().words.includes(w)){if(found.includes(w)){message("Bu kelimeyi zaten buldun.");current="";clearSel();render();return}found.push(w);const reward=w.length>=5?100:w.length===4?50:25;score+=reward;xp+=w.length>=5?25:15;gems+=w.length>=5?5:1;message("✅ "+w+" bulundu! +"+reward+" puan");current="";clearSel();if(found.length===lv().words.length){completed=true;score+=200;gems+=10;xp+=25;if(xp>=100)xp-=100;message("🏆 BÖLÜM TAMAMLANDI! +200 puan • +10 💎")}save();render()}else{message("❌ Kelime listede yok.");current="";clearSel();render()}}
$("letterArea").addEventListener("pointerdown",start);$("letterArea").addEventListener("pointermove",move);$("letterArea").addEventListener("pointerup",end);$("letterArea").addEventListener("pointercancel",end);
$("clear").addEventListener("click",()=>{dragging=false;current="";clearSel();message("Bir harfe basılı tut ve sürükle.");render()});
$("shuffle").addEventListener("click",()=>{if(completed)return;lv().letters.sort(()=>Math.random()-.5);current="";clearSel();message("🔀 Harfler karıştırıldı.");render()});
$("hint").addEventListener("click",()=>{if(completed)return;if(gems<20){message("💎 Yeterli elmas yok.");return}const target=lv().words.find(w=>!found.includes(w)&&w.startsWith(current));if(!target){message("Önce uygun bir kelime başlangıcı seç.");return}gems-=20;current+=target[current.length];message("💡 Açılan harf: "+target[current.length-1]);save();render()});
$("next").addEventListener("click",()=>{if(!completed)return;levelIndex=(levelIndex+1)%LEVELS.length;current="";found=[];completed=false;message("Yeni bölüm başladı.");save();render()});
window.addEventListener("resize",()=>{if(!dragging)renderLetters()});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));load();render();
})();
</script></body></html>
